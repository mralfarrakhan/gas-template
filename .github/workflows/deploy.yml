name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-gas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Code Quality Checks
        run: bun run check

  deploy:
    name: Deploy to Google Apps Script
    runs-on: ubuntu-latest
    needs: [check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate Clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Configure Clasp Project
        run: |
          echo '${{ secrets.CLASP_JSON }}' > .clasp.json

      - name: Build Google Apps Script & UI
        run: bun run build

      - name: Push Code to Apps Script
        run: bun run clasp push --force

      - name: Deploy Versioned Release
        run: bun run clasp deploy --description "Deployed from commit ${{ github.sha }}"
